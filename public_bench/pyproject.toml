[project]
name = "multitown-public-bench"
version = "0.1.0.dev0"
description = "Reproducible MultiTown A4/A8 evaluation on public multi-agent benchmarks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<51",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openai>=1.0,<2",
  "pandas>=2.2,<4",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
general-mas-freeze = "general_mas_bench.freeze:main"
general-mas-audit = "general_mas_bench.upstream_audit:main"
general-mas-run-teambench = "general_mas_bench.teambench_runner:main"
general-mas-report = "general_mas_bench.report:main"
general-mas-baseline-report = "general_mas_bench.baseline_report:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["general_mas_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
