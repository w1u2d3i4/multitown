multitown-a9-review-shield = "multitown.a9_safety_development:main"
multitown-a22-adaptive = "multitown.a22_runner:main"
multitown-a22-report = "multitown.a22_report:main"
multitown-a23-cr-ppo = "multitown.a23_runner:main"
multitown-pq1-qualify = "multitown.pq1_runner:main"
multitown-a24-cr-ppo = "multitown.a24_runner:main"
multitown-a24-monitor = "multitown.a24_monitor:main"
multitown-a24-finalize-orphan = "multitown.a24_orphan_finalizer:main"
